<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Collection Growth | VaultCardsTR</title>
  <link rel="icon" href="logo.png" type="image/png" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(255,157,46,.12), transparent 35%),
        #090909;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(9,9,9,.85);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
      font-weight: 800;
      font-size: 20px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,157,46,.4);
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .back-link {
      color: rgba(255,255,255,.7);
      text-decoration: none;
      font-size: 14px;
      transition: .2s;
    }

    .back-link:hover {
      color: #ff9d2e;
    }

    main {
      padding: 70px 0;
    }

    .eyebrow {
      color: #ff9d2e;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1;
    }

    .intro {
      margin-top: 16px;
      color: rgba(255,255,255,.58);
      font-size: 16px;
    }

    .growth-card {
      margin-top: 40px;
      padding: 28px;
      border-radius: 24px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.02)
      );
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
    }

    .growth-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .growth-label {
      display: block;
      color: rgba(255,255,255,.45);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    #growthTotal {
      display: block;
      font-size: 48px;
      line-height: 1;
    }

    .growth-badge {
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255,157,46,.12);
      color: #ff9d2e;
      border: 1px solid rgba(255,157,46,.25);
      font-size: 12px;
      font-weight: 800;
    }

    .chart-wrap {
      margin-top: 35px;
      width: 100%;
      overflow-x: auto;
    }

    #growthChart {
      width: 100%;
      min-width: 760px;
      height: 420px;
      display: block;
    }

    .growth-legend-note {
      margin-top: 10px;
      color: rgba(255,255,255,.52);
      font-size: 12px;
    }

    .status {
      margin-top: 18px;
      color: rgba(255,255,255,.45);
      font-size: 13px;
    }

    footer {
      padding: 30px 0 50px;
      color: rgba(255,255,255,.35);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 600px) {
      main {
        padding: 45px 0;
      }

      .growth-card {
        padding: 20px;
        border-radius: 18px;
      }

      .growth-header {
        align-items: flex-start;
        flex-direction: column;
      }

      #growthTotal {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="index.html" class="brand">
      <span class="brand-mark">
        <img src="logo.png" alt="VaultCardsTR">
      </span>

      <span>VaultCardsTR</span>
    </a>

    <a href="index.html" class="back-link">
      ← Back to Collection
    </a>

  </div>
</header>

<main>
  <div class="container">

    <div class="eyebrow">COLLECTION JOURNEY</div>

    <h1 id="growthTitle">Collection Growth</h1>

    <p class="intro">
      Track how the VaultCardsTR collection has grown over time.
    </p>

    <section class="growth-card">

      <div class="growth-header">

        <div>
          <span class="growth-label">TOTAL CARDS</span>
          <strong id="growthTotal">0</strong>
        </div>

        <div class="growth-badge">
          📈 Collection Growth · 3 Metrics
        </div>
        <div class="growth-legend-note">🟦 Cards · 🟩 Total Value · 🟨 Value / Card</div>

      </div>

      <div class="chart-wrap">
        <svg
          id="growthChart"
          viewBox="0 0 900 360"
          preserveAspectRatio="none">
        </svg>
      </div>

      <div id="growthStatus" class="status">
        Loading collection data...
      </div>

    </section>

  </div>
</main>

<footer>
  VaultCardsTR · Collection Growth
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const supabaseClient = window.supabase.createClient(
    window.FG_CONFIG.SUPABASE_URL,
    window.FG_CONFIG.SUPABASE_KEY
  );

  const params = new URLSearchParams(window.location.search);
  const userId = params.get("user");

  async function loadGrowthData() {
    const totalElement = document.getElementById("growthTotal");
    const chart = document.getElementById("growthChart");
    const status = document.getElementById("growthStatus");
    const titleElement = document.getElementById("growthTitle");

    const withTimeout = (promise, ms = 12000) => Promise.race([
      promise,
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error("Supabase request timed out")), ms)
      )
    ]);

    try {
      // Make sure the browser has restored the Supabase session before querying.
      await supabaseClient.auth.getSession();

      if (userId) {
        const { data: profile } = await withTimeout(
          supabaseClient.from("profiles").select("username").eq("id", userId).maybeSingle()
        );
        if (profile?.username) {
          titleElement.textContent = profile.username + "'s Collection Growth";
        }
      }

      // Query the same cards table used by profile.html, then filter locally.
      // This avoids any issue with a user-specific PostgREST filter.
      const { data: liveCards, error: cardsError } = await withTimeout(
        supabaseClient.from("cards").select("*").limit(5000)
      );

      if (cardsError) throw cardsError;

      const ownedCards = (liveCards || []).filter(card =>
        !userId || String(card.owner_id) === String(userId)
      );

      totalElement.textContent = ownedCards.length;

      const datedCards = ownedCards
        .map(card => ({ ...card, date: card.acquired_date || card.created_at }))
        .filter(card => card.date && !isNaN(new Date(card.date).getTime()))
        .sort((a,b) => new Date(a.date) - new Date(b.date));

      if (!datedCards.length) {
        chart.innerHTML = "";
        status.textContent = ownedCards.length
          ? "Kartlarda henüz geçerli bir alınma tarihi bulunamadı."
          : "Bu koleksiyonda henüz kart bulunamadı.";
        return;
      }

      const byDate = new Map();
      datedCards.forEach(card => {
        const key = new Date(card.date).toISOString().slice(0,10);
        if (!byDate.has(key)) byDate.set(key, []);
        byDate.get(key).push(card);
      });

      let cumulativeCards = 0;
      let cumulativeValue = 0;
      const points = [...byDate.entries()].map(([date, dayCards]) => {
        cumulativeCards += dayCards.length;
        cumulativeValue += dayCards.reduce((sum, card) => sum + (Number(card.estimated_value) || 0), 0);
        return {
          snapshot_date: date,
          total_cards: cumulativeCards,
          total_value: cumulativeValue,
          value_per_card: cumulativeCards ? cumulativeValue / cumulativeCards : 0
        };
      });

      const width = 1100, height = 420, padLeft = 60, padRight = 30, padTop = 55, padBottom = 55;
      const plotWidth = width - padLeft - padRight;
      const plotHeight = height - padTop - padBottom;
      const maxCards = Math.max(...points.map(p => p.total_cards), 1);
      const maxValue = Math.max(...points.map(p => p.total_value), 1);
      const maxPerCard = Math.max(...points.map(p => p.value_per_card), 1);

      const x = index => points.length === 1 ? padLeft + plotWidth / 2 : padLeft + (index / (points.length - 1)) * plotWidth;
      const y = (value, max) => padTop + plotHeight - (value / max) * plotHeight;

      const series = [
        { key: "total_cards", max: maxCards, color: "#68a9ff", label: "Cards" },
        { key: "total_value", max: maxValue, color: "#63d4a3", label: "Total Value" },
        { key: "value_per_card", max: maxPerCard, color: "#f2c14e", label: "Value / Card" }
      ];

      const grid = [0,.25,.5,.75,1].map(t => {
        const yy = padTop + plotHeight - t * plotHeight;
        return `<line x1="${padLeft}" y1="${yy}" x2="${width-padRight}" y2="${yy}" stroke="rgba(255,255,255,.07)" />`;
      }).join("");

      const labels = points.map((point,index) => {
        const d = new Date(point.snapshot_date);
        return `<text x="${x(index)}" y="${height-16}" text-anchor="middle" fill="rgba(255,255,255,.52)" font-size="11">${d.toLocaleDateString("tr-TR",{day:"2-digit",month:"short"})}</text>`;
      }).join("");

      const lines = series.map(s => {
        const coords = points.map((p,i) => `${x(i)},${y(Number(p[s.key])||0,s.max)}`).join(" ");
        const dots = points.map((p,i) => `<circle cx="${x(i)}" cy="${y(Number(p[s.key])||0,s.max)}" r="4.5" fill="${s.color}" />`).join("");
        return `<polyline points="${coords}" fill="none" stroke="${s.color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />${dots}`;
      }).join("");

      const legend = series.map((s,i) => `
        <g transform="translate(${i*190} 0)">
          <circle cx="0" cy="-3" r="5" fill="${s.color}" />
          <text x="11" y="1" fill="rgba(255,255,255,.78)" font-size="12">${s.label}</text>
        </g>`).join("");

      chart.innerHTML = `${grid}${lines}${labels}<g transform="translate(75 20)">${legend}</g>`;
      status.textContent = `${points.length} acquisition dates · Based on card acquired dates`;
    } catch (error) {
      console.error("Collection Growth error:", error);
      chart.innerHTML = "";
      status.textContent = error?.message === "Supabase request timed out"
        ? "Koleksiyon verisi zaman aşımına uğradı. Lütfen sayfayı yenileyin."
        : "Collection Growth verileri yüklenemedi.";
    }
  }
  loadGrowthData();
</script>

</body>
</html>
