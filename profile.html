<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Koleksiyoner | VaultCardstr</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .profile-page {
      min-height: 100vh;
      padding: 120px 5% 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .profile-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      color: #aeb4bf;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .profile-back:hover {
      color: #ff9d2e;
    }

    .collector-profile {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 34px;
      padding: 42px;
      margin-bottom: 55px;
      border-radius: 28px;
      border: 1px solid rgba(255,157,46,.18);
      background:
        radial-gradient(circle at 10% 50%, rgba(255,157,46,.14), transparent 38%),
        linear-gradient(135deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .collector-profile::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      right: -100px;
      top: -120px;
      border-radius: 50%;
      background: rgba(255,157,46,.08);
      filter: blur(20px);
      pointer-events: none;
    }

    .collector-avatar {
      position: relative;
      z-index: 2;
      width: 150px;
      height: 150px;
      flex: 0 0 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #ff9d2e;
      background: #11141a;
      box-shadow:
        0 0 0 8px rgba(255,157,46,.06),
        0 18px 45px rgba(0,0,0,.45);
    }

    .collector-avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .collector-avatar span {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 52px;
    }

    .collector-info {
      position: relative;
      z-index: 2;
    }

    .collector-eyebrow {
      color: #ff9d2e;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .collector-info h1 {
      margin: 8px 0 8px;
      font-size: clamp(38px, 5vw, 64px);
      line-height: .95;
      letter-spacing: -.06em;
      font-weight: 900;
    }

    .collector-info p {
      margin: 0 0 24px;
      color: #9da3ae;
      font-size: 15px;
    }

    .collector-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .collector-stat {
      min-width: 110px;
      padding: 13px 17px;
      border-radius: 14px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,157,46,.12);
    }

    .collector-stat strong {
      display: block;
      font-size: 23px;
      line-height: 1;
      font-weight: 900;
    }

    .collector-stat span {
      display: block;
      margin-top: 5px;
      color: #777e89;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .collection-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 25px;
    }

    .collection-heading .eyebrow {
      color: #ff9d2e;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .collection-heading h2 {
      margin: 7px 0 0;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1;
      letter-spacing: -.055em;
      font-weight: 900;
    }

    .collection-count {
      color: #777e89;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .profile-card-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .profile-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: #111318;
      border: 1px solid rgba(255,255,255,.08);
      cursor: pointer;
      transition: transform .25s ease, border-color .25s ease;
    }

    .profile-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,157,46,.35);
    }

    .profile-card-image {
      position: relative;
      aspect-ratio: .71;
      background: #171a22;
      overflow: hidden;
    }

    .profile-card-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .profile-sale {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      padding: 6px 10px;
      border-radius: 999px;
      background: #ff9d2e;
      color: #111;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .05em;
    }

    .profile-card-badges {
  position: absolute;
  left: 10px;
  bottom: 10px;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: calc(100% - 20px);
}

.profile-badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 5px 8px;
  border-radius: 7px;
  background: rgba(12,14,18,.88);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .08em;
  line-height: 1;
  box-sizing: border-box;
}

.profile-badge.rookie {
  color: #ffb45f;
  border-color: rgba(255,157,46,.35);
}

.profile-badge.numbered {
  color: #d9dde5;
  border-color: rgba(255,255,255,.18);
}

.profile-badge.autograph {
  color: #f4d58a;
  border-color: rgba(244,213,138,.35);
}

    .profile-card-info {
      padding: 16px;
    }

    .profile-card-info h3 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 850;
    }

    .profile-card-info p {
      margin: 0;
      color: #858b96;
      font-size: 12px;
    }

    .profile-empty {
      padding: 60px 20px;
      text-align: center;
      border: 1px dashed rgba(255,255,255,.12);
      border-radius: 20px;
      color: #858b96;
    }

    .profile-loading {
      padding: 80px 20px;
      text-align: center;
      color: #858b96;
    }

    @media (max-width: 1000px) {
      .profile-card-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .profile-page {
        padding: 100px 18px 50px;
      }

      .collector-profile {
        flex-direction: column;
        align-items: flex-start;
        padding: 28px;
      }

      .collector-avatar {
        width: 115px;
        height: 115px;
        flex-basis: 115px;
      }

      .profile-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .collection-heading {
        align-items: flex-start;
        flex-direction: column;
      }
    }
    /* ===== PROFILE EDIT MODAL ===== */

#profileEditForm {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 8px;
}

#profileEditForm > label:not(.check) {
  display: flex;
  flex-direction: column;
  gap: 7px;
  color: #aeb4bf;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}

#profileEditForm > label:nth-of-type(1),
#profileEditForm > label:nth-of-type(2) {
  grid-column: span 1;
}

#profileEditForm input,
#profileEditForm select,
#profileEditForm textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 12px;
  background: #0f1116;
  color: #f4f5f7;
  padding: 12px 13px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
  transition:
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

#profileEditForm input,
#profileEditForm select {
  height: 44px;
}

#profileEditForm textarea {
  min-height: 100px;
  resize: vertical;
}

#profileEditForm input:focus,
#profileEditForm select:focus,
#profileEditForm textarea:focus {
  border-color: rgba(255,157,46,.65);
  background: #12151b;
  box-shadow: 0 0 0 3px rgba(255,157,46,.10);
}

#profileEditForm input::placeholder,
#profileEditForm textarea::placeholder {
  color: #555c68;
}

/* Not alanı tam genişlik */
#profileEditForm > label:has(#peNote),
#profileEditForm > label:has(#peDolapUrl) {
  grid-column: 1 / -1;
}

/* Checkbox alanları */
#profileEditForm > label.check {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 10px 13px;
  box-sizing: border-box;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  background: rgba(255,255,255,.025);
  color: #d9dde5;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition:
    background .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

#profileEditForm > label.check:hover {
  background: rgba(255,157,46,.06);
  border-color: rgba(255,157,46,.22);
  transform: translateY(-1px);
}

#profileEditForm > label.check input {
  width: 17px;
  height: 17px;
  margin: 0;
  accent-color: #ff9d2e;
}

/* Alt butonlar */
#profileEditForm button {
  min-height: 46px;
  border-radius: 12px !important;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

#profileEditForm #profileEditCancel {
  background: rgba(255,255,255,.05) !important;
  color: #aeb4bf !important;
  border: 1px solid rgba(255,255,255,.10) !important;
}

#profileEditForm #profileEditCancel:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.09) !important;
  color: #fff !important;
}

#profileEditForm button[type="submit"] {
  background: linear-gradient(135deg, #ff9d2e, #ffb45f) !important;
  color: #111 !important;
  border: 0 !important;
  box-shadow: 0 10px 25px rgba(255,157,46,.15);
}

#profileEditForm button[type="submit"]:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(255,157,46,.25);
}

/* Mobil */
@media (max-width: 700px) {
  #profileEditForm {
    grid-template-columns: 1fr;
  }

  #profileEditForm > label:not(.check),
  #profileEditForm > label:has(#peNote),
  #profileEditForm > label:has(#peDolapUrl) {
    grid-column: 1;
  }
}
  </style>
</head>

      <div class="profile-loading">

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const { createClient } = supabase;

    const supabaseClient = createClient(
      window.FG_CONFIG.SUPABASE_URL,
      window.FG_CONFIG.SUPABASE_KEY
    );

    async function uploadProfileCardImage(file) {
  if (!file) return "";

  if (!file.type.startsWith("image/")) {
    throw new Error("Lütfen bir görsel seç.");
  }

  if (file.size > 6 * 1024 * 1024) {
    throw new Error("Fotoğraf 6 MB'dan küçük olsun.");
  }

  const ext =
    (file.name.split(".").pop() || "jpg")
      .toLowerCase()
      .replace(/[^a-z0-9]/g, "");

  const path = `${crypto.randomUUID()}.${ext}`;

  const { error: uploadError } = await supabaseClient
    .storage
    .from("card-images")
    .upload(path, file, {
      cacheControl: "31536000",
      contentType: file.type,
      upsert: false
    });

  if (uploadError) {
    throw uploadError;
  }

  const { data } = supabaseClient
    .storage
    .from("card-images")
    .getPublicUrl(path);

  return data.publicUrl;
}

    const params = new URLSearchParams(window.location.search);
    const userId = params.get("user");
    let currentUserId = null;

    const content = document.getElementById("profileContent");

   loadProfile();

supabaseClient.auth.getUser().then(({ data }) => {
  currentUserId = data.user?.id || null;

  if (currentUserId) {
    loadProfile();
  }
});
    
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function fallbackImage(card) {
      return "assets/card-placeholder.svg";
    }

    async function loadProfile() {

      if (!userId) {
        content.innerHTML = `
          <div class="profile-empty">
            <h2>Koleksiyoner bulunamadı</h2>
            <p>Geçerli bir profil bağlantısı gerekli.</p>
          </div>
        `;
        return;
      }

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("id, username, avatar_url, created_at")
          .eq("id", userId)
          .single();

      if (profileError || !profile) {
        console.error(profileError);

        content.innerHTML = `
          <div class="profile-empty">
            <h2>Koleksiyoner bulunamadı</h2>
            <p>Bu profil mevcut değil veya kaldırılmış olabilir.</p>
          </div>
        `;

        return;
      }

      const { data: cards, error: cardsError } =
        await supabaseClient
          .from("cards")
          .select("*")
          .eq("owner_id", userId)
          .order("id", { ascending: false });

      if (cardsError) {
        console.error(cardsError);

        content.innerHTML = `
          <div class="profile-empty">
            <h2>Koleksiyon yüklenemedi</h2>
            <p>Kartlar alınırken bir hata oluştu.</p>
          </div>
        `;

        return;
      }

      const userCards = cards || [];

      const footballCount =
        userCards.filter(card => card.category === "Football").length;

      const basketballCount =
        userCards.filter(card => card.category === "Basketball").length;

      document.title =
        `${profile.username || "Koleksiyoner"} | VaultCardstr`;


      const avatar = profile.avatar_url
        ? `
          <img
            src="${escapeHtml(profile.avatar_url)}"
            alt="${escapeHtml(profile.username || "Koleksiyoner")}"
          >
        `
        : `<span>👤</span>`;


      const cardHtml = userCards.length
        ? userCards.map(card => {

            const image =
              card.image_front_url ||
              card.image_url ||
              fallbackImage(card);

            return `
             <article class="profile-card card-item" data-id="${escapeHtml(card.id)}" tabindex="0">
                <div class="profile-card-image">

                  ${
                    card.for_sale
                      ? `<span class="profile-sale">SATILIK</span>`
                      : ""
                  }
<div class="profile-card-badges">
  ${
    card.rookie
      ? `<span class="profile-badge rookie">ROOKIE</span>`
      : ""
  }

  ${
    card.serial_number
      ? `<span class="profile-badge numbered">NUMBERED ${escapeHtml(card.serial_number)}</span>`
      : ""
  }

  ${
    card.autograph
      ? `<span class="profile-badge autograph">AUTOGRAPH</span>`
      : ""
  }
</div>
                  <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(card.player || "Kart")}"
                    loading="lazy"
                    onerror="this.src='${fallbackImage(card)}'"
                  >

                </div>

                <div class="profile-card-info">

  <h3>
    ${escapeHtml(card.player || "Bilinmeyen Oyuncu")}
  </h3>

  <p>
    ${escapeHtml(card.set || "Kart")} ·
    ${escapeHtml(card.year || "")}
  </p>

  ${userId === currentUserId ? `
    <div class="profile-card-actions">
      <button
        type="button"
        class="profile-edit-btn"
        data-id="${escapeHtml(card.id)}"
      >
        Düzenle
      </button>

      <button
        type="button"
        class="profile-delete-btn"
        data-id="${escapeHtml(card.id)}"
      >
        Sil
      </button>
    </div>
  ` : ""}

</div>
    

              </article>
            `;

          }).join("")
        : `
          <div class="profile-empty">
            <h2>Henüz kart yok</h2>
            <p>Bu koleksiyoner henüz koleksiyonuna kart eklememiş.</p>
          </div>
        `;


      content.innerHTML = `

        <section class="collector-profile">

          <div class="collector-avatar">
            ${avatar}
          </div>

          <div class="collector-info">

            <div class="collector-eyebrow">
              VAULTCARDSTR COLLECTOR
            </div>

            <h1>
              ${escapeHtml(profile.username || "Koleksiyoner")}
            </h1>

            <p>
              Koleksiyonunu keşfet
            </p>

            <div class="collector-stats">

              <div class="collector-stat">
                <strong>${userCards.length}</strong>
                <span>Kart</span>
              </div>

              <div class="collector-stat">
                <strong>${footballCount}</strong>
                <span>Football</span>
              </div>

              <div class="collector-stat">
                <strong>${basketballCount}</strong>
                <span>Basketball</span>
              </div>

            </div>

          </div>

        </section>


        <section>

  <div class="collection-heading">
    <div>
      <div class="eyebrow">
        COLLECTION
      </div>

      <h2>
        ${escapeHtml(profile.username || "Koleksiyoner")}'in Koleksiyonu
      </h2>
    </div>

    <div style="
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    ">

      <span class="collection-count">
        ${userCards.length} KART
      </span>

      ${
        userId === currentUserId
          ? `
            <button
              type="button"
              id="addCardBtn"
              style="
                border:0;
                border-radius:12px;
                padding:11px 16px;
                background:linear-gradient(135deg,#ff9d2e,#ffb45f);
                color:#111;
                font-size:12px;
                font-weight:900;
                cursor:pointer;
                box-shadow:0 10px 25px rgba(255,157,46,.15);
              "
            >
              + Kart Ekle
            </button>
          `
          : ""
      }

    </div>

  </div>


          <div class="profile-card-grid">
            ${cardHtml}
          </div>

        </section>

      `;
      const addCardBtn = content.querySelector("#addCardBtn");

if (addCardBtn) {
  addCardBtn.addEventListener("click", () => {
    const addBox = document.createElement("div");
    addBox.style.cssText = `
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 38px 24px 24px;
  box-sizing: border-box;
  overflow-y: auto;
`;

    addBox.className = "profile-edit-overlay";

    addBox.innerHTML = `
      <div class="profile-edit-modal">
        <div class="profile-edit-header">
          <div>
            <div class="eyebrow">NEW CARD</div>
            <h3>Kart Ekle</h3>
          </div>

          <button type="button" class="profile-edit-close">×</button>
        </div>

        <form id="newCardForm" style="padding:24px;">

  <div id="newCardFormGrid" style="
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
  ">

    <label>
      Oyuncu *
      <input id="ncPlayer" required placeholder="Örn. Cooper Flagg">
    </label>

    <label>
      Takım
      <input id="ncTeam" placeholder="Örn. Dallas Mavericks">
    </label>

    <label>
      Kategori
      <select id="ncCategory">
        <option value="Football">Football</option>
        <option value="Basketball">Basketball</option>
        <option value="Baseball">Baseball</option>
        <option value="American Football">American Football</option>
        <option value="Hockey">Hockey</option>
        <option value="Tennis">Tennis</option>
        <option value="F1 / Motorsport">F1 / Motorsport</option>
        <option value="Other">Other</option>
      </select>
    </label>

    <label>
      Yıl
      <input id="ncYear" placeholder="Örn. 2026">
    </label>

    <label>
      Set
      <input id="ncSetName" placeholder="Örn. Panini Prizm">
    </label>

    <label>
      Card No.
      <input id="ncCardNumber" placeholder="Örn. 47">
    </label>

    <label>
      Parallel
      <input id="ncParallel" value="Base" placeholder="Örn. Silver">
    </label>

    <label>
      Condition
      <input id="ncCondition" value="Raw">
    </label>

    <label>
      Grade
      <input id="ncGrade" value="—" placeholder="Örn. PSA 10">
    </label>

    <label>
      Alış fiyatı (TL)
      <input id="ncPurchasePrice" type="number" min="0" step="0.01" placeholder="600">
    </label>

    <label>
      Tahmini değer (USD)
      <input id="ncEstimatedValue" type="number" min="0" step="0.01" placeholder="150">
    </label>

    <label>
      Alındığı tarih
      <input id="ncAcquiredDate" type="date">
    </label>

    <label class="check">

    addBox.querySelector("#newCardForm").addEventListener("submit", async (e) => {

    alert("Önce hesabına giriş yapmalısın.");
    return;
  }

  const frontFile = addBox.querySelector("#ncImageFront").files[0];
  const backFile = addBox.querySelector("#ncImageBack").files[0];

  if (!frontFile) {
    alert("Kartın ön yüzünü seçmelisin.");
    return;
  }

  try {
    const frontUrl = await uploadProfileCardImage(frontFile);

    let backUrl = "";

    if (backFile) {
      backUrl = await uploadProfileCardImage(backFile);
    }

    const payload = {
      owner_id: currentUserId,

      player: addBox.querySelector("#ncPlayer").value.trim(),
      team: addBox.querySelector("#ncTeam").value.trim(),
      category: addBox.querySelector("#ncCategory").value,

      year: addBox.querySelector("#ncYear").value.trim(),
      set_name: addBox.querySelector("#ncSetName").value.trim(),
      card_number: addBox.querySelector("#ncCardNumber").value.trim(),
      parallel: addBox.querySelector("#ncParallel").value.trim() || "Base",

      condition: addBox.querySelector("#ncCondition").value.trim() || "Raw",
      grade: addBox.querySelector("#ncGrade").value.trim() || "—",

      purchase_price:

      estimated_value:
        Number(addBox.querySelector("#ncEstimatedValue").value) || 0,

      acquired_date:
        addBox.querySelector("#ncAcquiredDate").value || null,

      rookie: addBox.querySelector("#ncRookie").checked,

      serial_number:

      autograph:
        addBox.querySelector("#ncAutograph").checked,

      for_sale:
        addBox.querySelector("#ncForSale").checked,

      dolap_url:
        addBox.querySelector("#ncDolapUrl").value.trim(),

      image_url: frontUrl,
      image_front_url: frontUrl,
      image_back_url: backUrl,

      note:
        addBox.querySelector("#ncNote").value.trim(),

      status: "Collection"
    };

    const { error } = await supabaseClient
      .from("cards")
      .insert(payload);

    if (error) {
      console.error(error);
      alert("Kart kaydedilemedi.");
      return;
    }

    alert("Kart başarıyla eklendi! 🎉");

    addBox.remove();

    await loadProfile();

  } catch (error) {
    console.error(error);
    alert(error.message || "Kart eklenirken bir hata oluştu.");

<div class="modal hidden" id="cardModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="Kapat">×</button>
    <div class="modal-image-wrap">

  <img id="modalBackImage" src="" alt="" class="hidden" />

  <button
    class="modal-image-next"
    id="modalImageNext"
    type="button"
    aria-label="Kartın arka yüzünü göster"
  >
    →
  </button>
</div>
      <div class="modal-info">
        <div class="tag-row" id="modalTags"></div>
        <div class="eyebrow" id="modalCategory"></div>
        <h2 id="modalTitle"></h2>
        <p class="modal-subtitle" id="modalSubtitle"></p>
        <div class="details-grid" id="modalDetails"></div>
        <p class="modal-note" id="modalNote"></p>
      </div>
    </div>
  </div>

  <script>
document.addEventListener("click", async (e) => {
  const cardEl = e.target.closest(".profile-card");

  if (!cardEl) return;

  const cardId = cardEl.dataset.id;

  if (!cardId) return;

  const { data: card, error } = await supabaseClient
    .from("cards")
    .select("*")
    .eq("id", cardId)
    .single();

  if (error || !card) {
    console.error(error);
    return;
  }

  const modal = document.getElementById("cardModal");
  const modalImage = document.getElementById("modalImage");
  const modalBackImage = document.getElementById("modalBackImage");
  const modalTitle = document.getElementById("modalTitle");
  const modalSubtitle = document.getElementById("modalSubtitle");
  const modalCategory = document.getElementById("modalCategory");
  const modalTags = document.getElementById("modalTags");
  const modalDetails = document.getElementById("modalDetails");
  const modalNote = document.getElementById("modalNote");
  const modalImageNext = document.getElementById("modalImageNext");

  const frontImage =
    card.image_front_url ||
    card.image_url ||
    "";

  const backImage =
    card.image_back_url ||
    "";

  modalImage.src = frontImage;
  modalImage.classList.remove("hidden");

  if (modalBackImage) {
    if (backImage) {
      modalBackImage.src = backImage;
    }

    modalBackImage.classList.add("hidden");
  }

  modalTitle.textContent = card.player || "Kart";

  modalSubtitle.textContent =
    `${card.set_name || ""} · ${card.year || ""}`;

  modalCategory.textContent =
    card.category || "";

  modalTags.innerHTML = `
    ${card.grade && card.grade !== "—"
      ? `<span class="tag">${card.grade}</span>`
      : ""}
    ${card.for_sale
      ? `<span class="tag">SATILIK</span>`
      : ""}
  `;

  modalDetails.innerHTML = `
  <div class="detail">
    <span>SET</span>
    <strong>${card.set_name || "—"}</strong>
  </div>

  <div class="detail">
    <span>CARD NO.</span>
    <strong>${card.card_number || "—"}</strong>
  </div>

  <div class="detail">
    <span>PARALLEL</span>
    <strong>${card.parallel || "—"}</strong>
  </div>

  <div class="detail">
    <span>CONDITION</span>
    <strong>${card.condition || "—"}</strong>
  </div>

  <div class="detail">
    <span>GRADE</span>
    <strong>${card.grade || "—"}</strong>
  </div>

  <div class="detail">
    <span>ACQUIRED</span>
    <strong>${card.acquired_date || "—"}</strong>
  </div>

  <div class="detail">
    <span>PURCHASE PRICE</span>
    <strong>${card.purchase_price ? `${card.purchase_price} TL` : "—"}</strong>
  </div>

  <div class="detail">
    <span>ESTIMATED VALUE</span>
    <strong>$${Number(card.estimated_value || 0).toLocaleString("en-US")}</strong>
  </div>
`;

  modalNote.textContent =
    card.notes || "";

  modal.classList.remove("hidden");

  let showingBack = false;

  if (modalImageNext) {
    modalImageNext.onclick = (event) => {
      event.stopPropagation();

      if (!backImage) return;

      showingBack = !showingBack;

      if (showingBack) {
        modalImage.classList.add("hidden");
        modalBackImage.classList.remove("hidden");
        modalImageNext.textContent = "←";
      } else {
        modalBackImage.classList.add("hidden");
        modalImage.classList.remove("hidden");
        modalImageNext.textContent = "→";
      }
    };
  }
});

document.getElementById("modalClose")?.addEventListener("click", () => {
  document.getElementById("cardModal")?.classList.add("hidden");
});

document.querySelector("[data-close-modal]")?.addEventListener("click", () => {
  document.getElementById("cardModal")?.classList.add("hidden");
});
</script>
